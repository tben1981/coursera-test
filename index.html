<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ben's Microblog</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar"> 
    <div class="navbar__brand">
      <img class="navbar__logo" src="logo.svg" alt="The microblog logo" /> Ben's Microblog   
    </div>
    <ul class="navbar__navigation">
      <li class="navbar__navigation-item"> <a href="#" class="navbar__link">Recent</a> </li>
      <li class="navbar__navigation-item"> <a href="#" class="navbar__link">Calendar</a> </li>
    </ul>
  </header>
  <main class="main">  
    <section>
      <h1> Add new entry</h1>
      <form class="form" action="/entry" method="POST">
        <p class="form__input">
          <label for="entry" class="form__label">Entry Contents: </label>
          <textarea name="content" id="entry" class="form__textarea"></textarea>
        </p>
        <button type="submit" class="form__submit">Add entry</button>
       </form>
    </section> <!-- Section for posting form -->
    <section> 
      <h1> Recent posts </h1>
      <article class="entry">
        <div>
          <h2 class="entry__title">A bit of a chill day today </h2> 
          <time class="entry__date" datetime="24-10-2025">•Oct 25 </time>
        </div>
        <p class="entry__content">
          Today I couldnt do much programming, but its ok! Cant be too awesome everyday now!
        </p>
      </article>
    </section> <!-- Section for displaying old post (articles) -->
  </main>
  <footer class="footer"> 
    <div class="footer__content">
      <section class="footer__left"> 
        <a class="footer__item">Made by Benjamin Tan</a>
        <a class="footer__item">Check out my other projects</a>
      </section>
      <section class="footer__right">
        <div class="footer__right-column">
            <a class="footer__item">Recent</a>
            <a class="footer__item">Calendar</a>
        </div>
        <div class="footer__right-column">
            <a class="footer__item">About</a>
            <a class="footer__item">How this was made</a>
        </div>
      </section>

    </div> 
  </footer>
  
</body>
</html>
